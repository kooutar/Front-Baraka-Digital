 <div class="flex-1 overflow-y-auto bg-linear-to-br from-gray-900 via-gray-800 to-gray-900">

    

        <!-- Header avec effet de lumière -->
        <div class="text-center mb-8 relative">
            <div class="absolute inset-0 bg-gradient-to-r from-blue-500/20 to-purple-500/20 blur-3xl"></div>
            <h1 class="text-4xl font-bold relative bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent mb-2">
                Effectuer un Dépôt
            </h1>
           <app-alert></app-alert>
            <div class="h-1 w-24 bg-gradient-to-r from-blue-500 to-purple-500 rounded-full mx-auto"></div>
            
        </div>

        <!-- Formulaire -->
        <form [formGroup]="fromGroup" (ngSubmit)="onSubmit()" class="glass-effect rounded-2xl p-8 shadow-2xl relative overflow-hidden">
            <!-- Effet de gradient en arrière-plan -->
            <div class="absolute inset-0 gradient-bg opacity-50"></div>
            
            <div class="relative z-10 space-y-6">
                <!-- Groupe input avec icône -->
                <div class="group">
                    <label for="montant" class="block text-sm font-medium text-gray-300 mb-2 flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-blue-400"></span>
                        Montant à déposer
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-gray-400 group-focus-within:text-blue-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                        </div>
                        <input 
                            type="number" 
                            id="montant"
                            formControlName="amount"
                            placeholder="0.00"
                            min="0"
                            step="0.01"
                            required
                            class="w-full pl-12 pr-4 py-4 bg-gray-800/50 border border-gray-700 rounded-xl text-white placeholder-gray-500 text-lg transition-all duration-300 hover:border-gray-600"
                        >
                        <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
                            <span class="text-gray-400 font-medium">MAD</span>
                        </div>
                    </div>
                    <p class="mt-2 text-xs text-gray-400 flex items-center gap-1">
                        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
                        </svg>
                        Montant minimum: 10 MAD
                    </p>
                </div>

                <!-- Bouton de soumission -->
                <button 
                    type="submit"
                    class="w-full group relative px-6 py-4 bg-gradient-to-r from-blue-500 to-purple-500 text-white font-semibold rounded-xl transition-all duration-300 hover:shadow-lg hover:shadow-blue-500/50 hover:scale-[1.02] active:scale-[0.98] flex items-center justify-center gap-2"
                >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                    </svg>
                    <span>Déposer</span>
                    <svg class="w-5 h-5 arrow transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
                    </svg>
                </button>

                <!-- Info supplémentaire -->
                <div class="pt-4 border-t border-gray-700/50">
                    <p class="text-xs text-gray-400 text-center">
                        💡 Votre dépôt sera traité instantanément
                    </p>
                </div>
            </div>
        </form>

        <!-- Card d'information -->
        <div class="mt-6 glass-effect rounded-xl p-4 border border-gray-700/50">
            <div class="flex items-start gap-3">
                <div class="w-8 h-8 rounded-full bg-blue-500/20 flex items-center justify-center flex-shrink-0">
                    <svg class="w-4 h-4 text-blue-400" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
                    </svg>
                </div>
                <div>
                    <h3 class="text-sm font-semibold text-white mb-1">Informations importantes</h3>
                    <ul class="text-xs text-gray-400 space-y-1">
                        <li>• Transaction sécurisée et cryptée</li>
                        <li>• Aucun frais de dépôt</li>
                        <li>• Confirmation immédiate par email</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
