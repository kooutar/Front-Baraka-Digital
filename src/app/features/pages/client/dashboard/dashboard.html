
  <!-- Sidebar -->
  

  <!-- Main Content -->
  <div class="flex-1 overflow-y-auto bg-linear-to-br from-gray-900 via-gray-800 to-gray-900">
    <!-- Header -->
    <div class="bg-gray-800/50 backdrop-blur-sm border-b border-gray-700/50 p-6">
      <div class="max-w-7xl mx-auto">
        <h1 class="text-3xl font-bold bg-linear-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">
          Tableau de bord
        </h1>
        <p class="text-gray-400 mt-1">Bienvenue, {{user?.email}} </p>
      </div>
    </div>

    <!-- Dashboard Content -->
    <div class="max-w-7xl mx-auto p-6 space-y-6">
      
      <!-- Informations Utilisateur -->
      <div class="bg-linear-to-r from-gray-800 to-gray-800/50 rounded-2xl p-6 border border-gray-700/50 shadow-xl">
        <div class="flex items-center gap-4 mb-6">
          <div class="w-20 h-20 rounded-full bg-linear-to-br from-blue-500 to-purple-500 flex items-center justify-center text-3xl font-bold text-white shadow-lg">
            
          </div>
          <div class="flex-1">
            <h2 class="text-2xl font-bold text-white"></h2>
            <p class="text-gray-400"></p>
          </div>
          <div class="text-right">
            <p class="text-sm text-gray-400">Compte N° </p>
            <p class="text-xl font-mono text-blue-400"></p>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="bg-gray-900/50 rounded-xl p-4 border border-gray-700/50">
            <p class="text-gray-400 text-sm mb-1">Téléphone</p>
            <p class="text-white font-semibold"></p>
          </div>
          <div class="bg-gray-900/50 rounded-xl p-4 border border-gray-700/50">
            <p class="text-gray-400 text-sm mb-1">Adresse</p>
            <p class="text-white font-semibold"></p>
          </div>
          <div class="bg-gray-900/50 rounded-xl p-4 border border-gray-700/50">
            <p class="text-gray-400 text-sm mb-1">Membre depuis</p>
            <p class="text-white font-semibold"></p>
          </div>
        </div>
      </div>

      <!-- Solde Principal -->
      <div class="relative overflow-hidden bg-linear-to-br from-blue-600 via-blue-500 to-purple-600 rounded-2xl p-8 border border-blue-400/30 shadow-2xl">
        <div class="absolute top-0 right-0 w-64 h-64 bg-white/10 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2"></div>
        <div class="relative z-10">
          <p class="text-blue-100 text-sm uppercase tracking-wider mb-2">Solde disponible</p>
          <p class="text-5xl font-bold text-white mb-4"></p>
          <div class="flex gap-3">
            <button class="px-6 py-2 bg-white/20 hover:bg-white/30 backdrop-blur-sm rounded-lg text-white font-semibold transition-all duration-300 border border-white/30">
              Effectuer un virement
            </button>
            <button class="px-6 py-2 bg-white/10 hover:bg-white/20 backdrop-blur-sm rounded-lg text-white font-semibold transition-all duration-300 border border-white/20">
              Télécharger RIB
            </button>
          </div>
        </div>
      </div>

      <!-- Statistiques -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Dépôts -->
        <div class="bg-gray-800/50 backdrop-blur-sm rounded-2xl p-6 border border-gray-700/50 hover:border-green-500/50 transition-all duration-300 group">
          <div class="flex items-center justify-between mb-4">
            <div class="w-12 h-12 rounded-xl bg-green-500/20 flex items-center justify-center group-hover:scale-110 transition-transform">
              <svg class="w-6 h-6 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
              </svg>
            </div>
            <span class="text-green-400 text-sm font-semibold">+%</span>
          </div>
          <p class="text-gray-400 text-sm mb-1">Total Dépôts</p>
          <p class="text-3xl font-bold text-white"></p>
          <p class="text-gray-500 text-sm mt-2"> transactions</p>
        </div>

        <!-- Retraits -->
        <div class="bg-gray-800/50 backdrop-blur-sm rounded-2xl p-6 border border-gray-700/50 hover:border-red-500/50 transition-all duration-300 group">
          <div class="flex items-center justify-between mb-4">
            <div class="w-12 h-12 rounded-xl bg-red-500/20 flex items-center justify-center group-hover:scale-110 transition-transform">
              <svg class="w-6 h-6 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"/>
              </svg>
            </div>
            <span class="text-red-400 text-sm font-semibold">-%</span>
          </div>
          <p class="text-gray-400 text-sm mb-1">Total Retraits</p>
          <p class="text-3xl font-bold text-white"></p>
          <p class="text-gray-500 text-sm mt-2"> transactions</p>
        </div>

        <!-- Virements -->
        <div class="bg-gray-800/50 backdrop-blur-sm rounded-2xl p-6 border border-gray-700/50 hover:border-blue-500/50 transition-all duration-300 group">
          <div class="flex items-center justify-between mb-4">
            <div class="w-12 h-12 rounded-xl bg-blue-500/20 flex items-center justify-center group-hover:scale-110 transition-transform">
              <svg class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
              </svg>
            </div>
            <span class="text-blue-400 text-sm font-semibold"></span>
          </div>
          <p class="text-gray-400 text-sm mb-1">Total Virements</p>
          <p class="text-3xl font-bold text-white"></p>
          <p class="text-gray-500 text-sm mt-2">Ce mois</p>
        </div>
      </div>

      <!-- Transactions Récentes -->
      <div class="bg-gray-800/50 backdrop-blur-sm rounded-2xl p-6 border border-gray-700/50">
        <div class="flex items-center justify-between mb-6">
          <h3 class="text-xl font-bold text-white">Transactions récentes</h3>
          <a routerLink="/client/mes-transactions" class="text-blue-400 hover:text-blue-300 text-sm font-semibold flex items-center gap-2 transition-colors">
            Voir tout
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
          </a>
        </div>

        <div class="space-y-3">
          <!-- Transaction Item -->
          <div 
               class="flex items-center gap-4 p-4 bg-gray-900/50 rounded-xl border border-gray-700/30 hover:border-gray-600/50 transition-all duration-300">
            <div class="w-10 h-10 rounded-full flex items-center justify-center"
                >
              <svg class="w-5 h-5" 
                  
                   fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                     />
              </svg>
            </div>
            <div class="flex-1">
              <p class="text-white font-semibold"> transaction.label </p>
              <p class="text-gray-400 text-sm"></p>
            </div>
            <div class="text-right">
              <p class="font-bold text-lg"
                 >
               
              </p>
              <p class="text-gray-500 text-sm"></p>
            </div>
          </div>
        </div>
      </div>

      <!-- Graphique Mensuel -->
      <div class="bg-gray-800/50 backdrop-blur-sm rounded-2xl p-6 border border-gray-700/50">
        <h3 class="text-xl font-bold text-white mb-6">Activité mensuelle</h3>
        <div class="h-64 flex items-end justify-between gap-2">
          <div  class="flex-1 flex flex-col items-center gap-2">
            <div class="w-full bg-linear-to-t from-blue-600 to-purple-600 rounded-t-lg hover:from-blue-500 hover:to-purple-500 transition-all duration-300 cursor-pointer"
                >
            </div>
            <p class="text-gray-400 text-xs"></p>
          </div>
        </div>
      </div>

    </div>
  </div>
