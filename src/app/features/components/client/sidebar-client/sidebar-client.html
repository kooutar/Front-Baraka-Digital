<div class="sidebar relative bg-linear-to-b from-gray-900 via-gray-800 to-gray-900 text-white h-screen w-64 flex flex-col p-6 shadow-2xl border-r border-gray-700/50">
  <!-- Header avec effet glassmorphism -->
  <div class="mb-10 relative">
    <div class="absolute inset-0 bg-linear-to-r from-blue-500/20 to-purple-500/20 blur-xl"></div>
    <h2 class="text-3xl font-bold relative bg-linear-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">
      Client
    </h2>
    <div class="h-1 w-16 bg-linear-to-r from-blue-500 to-purple-500 rounded-full mt-2"></div>
  </div>

  <nav class="flex flex-col gap-3 flex-1">
    <!-- Dashboard -->
    <a routerLink="/client/dashboard" routerLinkActive="active" 
       class="sidebar-link group relative px-4 py-3 rounded-lg transition-all duration-300 hover:bg-linear-to-r hover:from-blue-500/10 hover:to-purple-500/10 hover:translate-x-1 border border-transparent hover:border-gray-700">
      <span class="relative z-10 flex items-center gap-3">
        <span class="w-2 h-2 rounded-full bg-blue-400 opacity-0 group-hover:opacity-100 transition-opacity"></span>
        Dashboard
      </span>
    </a>


    <a routerLink="/client/createAccount" routerLinkActive="active" *ngIf="!accountExist$" 
       class="sidebar-link group relative px-4 py-3 rounded-lg transition-all duration-300 hover:bg-linear-to-r hover:from-blue-500/10 hover:to-purple-500/10 hover:translate-x-1 border border-transparent hover:border-gray-700">
      <span class="relative z-10 flex items-center gap-3">
        <span class="w-2 h-2 rounded-full bg-blue-400 opacity-0 group-hover:opacity-100 transition-opacity"></span>
        Cree compte bancaire
      </span>
    </a>

    <!-- Transactions Dropdown -->
    <div class="dropdown group">
      <span class="sidebar-link cursor-pointer relative px-4 py-3 rounded-lg transition-all duration-300 hover:bg-linear-to-r hover:from-blue-500/10 hover:to-purple-500/10 hover:translate-x-1 border border-transparent hover:border-gray-700 flex items-center justify-between">
        <span class="flex items-center gap-3">
          <span class="w-2 h-2 rounded-full bg-purple-400 opacity-0 group-hover:opacity-100 transition-opacity"></span>
          Transactions
        </span>
        <svg class="w-4 h-4 transition-transform group-hover:rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </span>
      <div class="dropdown-menu ml-6 flex flex-col gap-2 mt-2 pl-4 border-l-2 border-gray-700">
        <a routerLink="/client/depot" routerLinkActive="active"
           class="sidebar-link text-sm py-2 px-3 rounded-md hover:bg-gray-700/50 hover:translate-x-1 transition-all duration-200">
          Dépôt
        </a>
        <a routerLink="/client/retrait" 
           class="sidebar-link text-sm py-2 px-3 rounded-md hover:bg-gray-700/50 hover:translate-x-1 transition-all duration-200">
          Retrait
        </a>
        <a routerLink="/client/virement" routerLinkActive="active" 
           class="sidebar-link text-sm py-2 px-3 rounded-md hover:bg-gray-700/50 hover:translate-x-1 transition-all duration-200">
          Virement
        </a>
      </div>
    </div>

    <!-- Mes transactions -->
    <a routerLink="/client/mes-transactions" routerLinkActive="active" 
       class="sidebar-link group relative px-4 py-3 rounded-lg transition-all duration-300 hover:bg-linear-to-r hover:from-blue-500/10 hover:to-purple-500/10 hover:translate-x-1 border border-transparent hover:border-gray-700">
      <span class="relative z-10 flex items-center gap-3">
        <span class="w-2 h-2 rounded-full bg-blue-400 opacity-0 group-hover:opacity-100 transition-opacity"></span>
        Mes transactions
      </span>
    </a>

    <!-- Documents Dropdown -->
    <div class="dropdown group">
      <span class="sidebar-link cursor-pointer relative px-4 py-3 rounded-lg transition-all duration-300 hover:bg-linear-to-r hover:from-blue-500/10 hover:to-purple-500/10 hover:translate-x-1 border border-transparent hover:border-gray-700 flex items-center justify-between">
        <span class="flex items-center gap-3">
          <span class="w-2 h-2 rounded-full bg-purple-400 opacity-0 group-hover:opacity-100 transition-opacity"></span>
          Documents
        </span>
        <svg class="w-4 h-4 transition-transform group-hover:rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </span>
      <div class="dropdown-menu ml-6 flex flex-col gap-2 mt-2 pl-4 border-l-2 border-gray-700">
        <a routerLink="/client/documents/upload" routerLinkActive="active" 
           class="sidebar-link text-sm py-2 px-3 rounded-md hover:bg-gray-700/50 hover:translate-x-1 transition-all duration-200">
          Uploader document
        </a>
        <a routerLink="/client/documents/list" routerLinkActive="active" 
           class="sidebar-link text-sm py-2 px-3 rounded-md hover:bg-gray-700/50 hover:translate-x-1 transition-all duration-200">
          Mes documents
        </a>
      </div>
    </div>
  </nav>

  <!-- Logout avec style distinct -->
  <div class="mt-auto pt-6 border-t border-gray-700/50">
    <a 
       class="sidebar-link cursor-pointer flex items-center gap-3 px-4 py-3 rounded-lg transition-all duration-300 bg-red-500/10 hover:bg-red-500/20 text-red-400 hover:text-red-300 border border-red-500/30 hover:border-red-500/50 group">
      <svg class="w-5 h-5 transition-transform group-hover:-translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
      </svg>
      Déconnexion
    </a>
  </div>
</div>
